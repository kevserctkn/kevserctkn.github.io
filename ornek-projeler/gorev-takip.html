<!DOCTYPE html>
<html lang="tr"><head><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1" name="viewport"/><title>Görev Takip Uygulaması | Örnek Çalışma</title><style>*{box-sizing:border-box}body{margin:0;font:16px system-ui,Arial;background:#11101a;color:#f4eefb}header{padding:18px 6%;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #ffffff20}a{color:#d5a4ff}button,input{font:inherit}button{border:0;border-radius:12px;padding:12px 18px;cursor:pointer;background:#a36df0;color:#171020}main{max-width:1000px;margin:5vh auto;padding:24px}.tag{color:#c9a1f2;letter-spacing:.13em;font-size:12px}.panel{background:#201b2c;border:1px solid #ffffff22;border-radius:24px;padding:25px}h1{font-size:clamp(32px,6vw,64px);line-height:1.1}p{line-height:1.7;color:#d4cadf}button:focus-visible,a:focus-visible{outline:3px solid white;outline-offset:3px}</style>
<meta content="Görev Takip Uygulaması | Örnek Çalışma: etkileşimli portfolyo uygulaması ve tasarım örneği." name="description"/>
<meta content="Görev Takip Uygulaması | Örnek Çalışma" property="og:title"/><meta content="Görev Takip Uygulaması | Örnek Çalışma: etkileşimli portfolyo uygulaması ve tasarım örneği." property="og:description"/><meta content="website" property="og:type"/><meta content="tr_TR" property="og:locale"/><meta content="summary" name="twitter:card"/></head><body><header><b>✦ ÖRNEK ÇALIŞMA</b><a href="../galeri.html">← Galeriye dön</a><a href="gorev-takip-en.html" lang="en">EN</a></header><main><span class="tag">03 / JAVASCRIPT DEMOSU</span><h1>Mini görev panosu</h1><p>Görev ekle, tamamla ve sil. Bu örnek uygulama tarayıcıda çalışır; sayfa yenilenince liste sıfırlanır.</p><div class="panel"><form id="taskform" style="display:flex;gap:8px"><input aria-label="Yeni görev" id="task" placeholder="Yeni görev..." required="" style="flex:1;min-width:0;border:1px solid #7b658c;border-radius:12px;padding:12px;background:#100d19;color:white"/><button>Ekle +</button></form><ul id="tasks" style="list-style:none;padding:0;display:grid;gap:10px"></ul></div></main><script>const list=document.querySelector('#tasks');document.querySelector('#taskform').onsubmit=e=>{e.preventDefault();const inp=document.querySelector('#task');if(!inp.value.trim())return;const li=document.createElement('li');li.style.cssText='display:flex;align-items:center;gap:12px;padding:12px;background:#332a43;border-radius:12px';const check=document.createElement('input');check.type='checkbox';check.setAttribute('aria-label','Tamamlandı');const span=document.createElement('span');span.textContent=inp.value.trim();span.style.flex='1';check.onchange=()=>span.style.textDecoration=check.checked?'line-through':'none';const del=document.createElement('button');del.textContent='Sil';del.onclick=()=>li.remove();li.append(check,span,del);list.append(li);inp.value='';inp.focus()}</script></body></html>
