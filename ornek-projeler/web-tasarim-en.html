<meta content="Personal Web Design | Sample Project" property="og:title"/><meta content="Personal Web Design | Sample Project: interactive portfolio application and design example." property="og:description"/><meta content="website" property="og:type"/><meta content="en_US" property="og:locale"/><meta content="summary" name="twitter:card"/></head><body><header><b>✦ SAMPLE PROJECT</b><a href="../gallery.html">← Back to gallery</a><a href="web-tasarim.html" lang="tr">TR</a></header><main><span class="tag">01 / WEB DESIGN</span><h1>Hello, I am <span id="name">a design enthusiast.</span></h1><p>A clean page, subtle motion and a readable layout. This is a web design demo.</p><div class="panel"><h2>Interactive design demo</h2><p>Press the button to change the color palette.</p><button id="theme">Change colors ✨</button></div></main><script>let n=0;document.querySelector('#theme').onclick=()=>{n++;document.body.style.background=n%2?'#f4ebde':'#11101a';document.body.style.color=n%2?'#25202e':'#f4eefb';document.querySelectorAll('p').forEach(e=>e.style.color=n%2?'#554b59':'#d4cadf')}</script></body></html>
