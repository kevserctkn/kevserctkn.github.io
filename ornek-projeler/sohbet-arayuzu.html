<!DOCTYPE html>
<html lang="tr"><head><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1" name="viewport"/><title>Sohbet Arayüzü | Örnek Çalışma</title><style>*{box-sizing:border-box}body{margin:0;font:16px system-ui,Arial;background:#11101a;color:#f4eefb}header{padding:18px 6%;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #ffffff20}a{color:#d5a4ff}button,input{font:inherit}button{border:0;border-radius:12px;padding:12px 18px;cursor:pointer;background:#a36df0;color:#171020}main{max-width:1000px;margin:5vh auto;padding:24px}.tag{color:#c9a1f2;letter-spacing:.13em;font-size:12px}.panel{background:#201b2c;border:1px solid #ffffff22;border-radius:24px;padding:25px}h1{font-size:clamp(32px,6vw,64px);line-height:1.1}p{line-height:1.7;color:#d4cadf}button:focus-visible,a:focus-visible{outline:3px solid white;outline-offset:3px}</style>
<meta content="Sohbet Arayüzü | Örnek Çalışma: etkileşimli portfolyo uygulaması ve tasarım örneği." name="description"/>
<meta content="Sohbet Arayüzü | Örnek Çalışma" property="og:title"/><meta content="Sohbet Arayüzü | Örnek Çalışma: etkileşimli portfolyo uygulaması ve tasarım örneği." property="og:description"/><meta content="website" property="og:type"/><meta content="tr_TR" property="og:locale"/><meta content="summary" name="twitter:card"/></head><body><header><b>✦ ÖRNEK ÇALIŞMA</b><a href="../galeri.html">← Galeriye dön</a><a href="sohbet-arayuzu-en.html" lang="en">EN</a></header><main><span class="tag">02 / ETKİLEŞİMLİ ARAYÜZ</span><h1>Sohbet arayüzü</h1><p>Bu bir <b>örnek sohbet simülasyonudur</b>; gerçek yapay zekâ servisine bağlı değildir.</p><div class="panel"><div aria-live="polite" id="messages" style="min-height:200px;display:flex;flex-direction:column;gap:12px"><div style="background:#362a48;padding:14px;border-radius:14px;align-self:flex-start">Merhaba! Bir konu yaz, örnek yanıt vereyim. 👋</div></div><form id="chat" style="display:flex;gap:8px;margin-top:24px"><input aria-label="Mesaj" id="message" placeholder="Mesajını yaz..." required="" style="min-width:0;flex:1;background:#100d19;color:white;border:1px solid #7b658c;border-radius:12px;padding:12px"/><button>Gönder</button></form></div></main><script>document.querySelector('#chat').onsubmit=e=>{e.preventDefault();const inp=document.querySelector('#message'),box=document.querySelector('#messages'),val=inp.value.trim();if(!val)return;for(const [txt,me] of [[val,true],['Bu bir tasarım demosu. Mesajını aldım! Gerçek yapay zekâ bağlantısı bu örnekte bulunmuyor.',false]]){const d=document.createElement('div');d.textContent=txt;d.style.cssText='padding:14px;border-radius:14px;max-width:85%;align-self:'+(me?'flex-end;background:#a36df0;color:#170d26':'flex-start;background:#362a48');box.append(d)}inp.value='';box.lastElementChild.scrollIntoView({block:'nearest',behavior:'smooth'})}</script></body></html>
