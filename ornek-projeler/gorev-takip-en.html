<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1" name="viewport"/><title>Task Tracker | Sample Project</title><style>*{box-sizing:border-box}body{margin:0;font:16px system-ui,Arial;background:#11101a;color:#f4eefb}header{padding:18px 6%;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #ffffff20}a{color:#d5a4ff}button,input{font:inherit}button{border:0;border-radius:12px;padding:12px 18px;cursor:pointer;background:#a36df0;color:#171020}main{max-width:1000px;margin:5vh auto;padding:24px}.tag{color:#c9a1f2;letter-spacing:.13em;font-size:12px}.panel{background:#201b2c;border:1px solid #ffffff22;border-radius:24px;padding:25px}h1{font-size:clamp(32px,6vw,64px);line-height:1.1}p{line-height:1.7;color:#d4cadf}button:focus-visible,a:focus-visible{outline:3px solid white;outline-offset:3px}</style>
<meta content="Task Tracker | Sample Project: interactive portfolio application and design example." name="description"/>
<meta content="Task Tracker | Sample Project" property="og:title"/><meta content="Task Tracker | Sample Project: interactive portfolio application and design example." property="og:description"/><meta content="website" property="og:type"/><meta content="en_US" property="og:locale"/><meta content="summary" name="twitter:card"/></head><body><header><b>✦ SAMPLE PROJECT</b><a href="../gallery.html">← Back to gallery</a><a href="gorev-takip.html" lang="tr">TR</a></header><main><span class="tag">03 / JAVASCRIPT DEMO</span><h1>Mini task board</h1><p>Add, complete and delete tasks. This demo runs in your browser; refreshing resets the list.</p><div class="panel"><form id="taskform" style="display:flex;gap:8px"><input aria-label="New task" id="task" placeholder="New task..." required="" style="flex:1;min-width:0;border:1px solid #7b658c;border-radius:12px;padding:12px;background:#100d19;color:white"/><button>Add +</button></form><ul id="tasks" style="list-style:none;padding:0;display:grid;gap:10px"></ul></div></main><script>const list=document.querySelector('#tasks');document.querySelector('#taskform').onsubmit=e=>{e.preventDefault();const inp=document.querySelector('#task');if(!inp.value.trim())return;const li=document.createElement('li');li.style.cssText='display:flex;align-items:center;gap:12px;padding:12px;background:#332a43;border-radius:12px';const check=document.createElement('input');check.type='checkbox';check.setAttribute('aria-label','Completed');const span=document.createElement('span');span.textContent=inp.value.trim();span.style.flex='1';check.onchange=()=>span.style.textDecoration=check.checked?'line-through':'none';const del=document.createElement('button');del.textContent='Delete';del.onclick=()=>li.remove();li.append(check,span,del);list.append(li);inp.value='';inp.focus()}</script></body></html>
